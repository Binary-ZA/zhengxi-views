name: 郑希视角日报

on:
  schedule:
    - cron: "0 0 * * *"    # 北京时间 08:00 盘前
    - cron: "0 12 * * *"   # 北京时间 20:00 盘后
  workflow_dispatch:
    inputs:
      mode:
        description: "pre=盘前 / post=盘后"
        default: "pre"
        type: choice
        options: [pre, post]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成并推送日报
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 12 * * *' && 'post' || 'pre') }}
        run: python scripts/daily_report.py --mode "$MODE"

      # 下面两步依赖仓库已开启 Pages（Settings → Pages → Source 选 GitHub Actions）。
      # 加 continue-on-error：没开 Pages 时自动跳过，不影响报告生成和归档。
      - name: 准备网页
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: outputs

      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 归档报告
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: outputs/
          retention-days: 90
